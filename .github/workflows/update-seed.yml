name: Actualizar seed y CSVs

on:
  schedule:
    - cron: '30 4 * * 1'  # Lunes 4:30 AM UTC — después del pipeline semanal
  workflow_dispatch:        # permite ejecución manual desde GitHub

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r .github/scripts/requirements.txt

      - name: Generar seed y CSVs
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: python .github/scripts/generate_seed.py

      - name: Commit y push si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seed.sql csv/
          git diff --staged --quiet || git commit -m "data: actualiza seed y CSVs $(date -u +'%Y-%m-%d')"
          git push
